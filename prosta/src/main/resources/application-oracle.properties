server.servlet.context-path=/prosta

# Production HTTPS terminates at a trusted reverse proxy/LB.
# Forward X-Forwarded-Proto and restrict direct access to the application port.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
#server.port=7778
spring.thymeleaf.cache=false

spring.mvc.format.date=yyyy/MM/dd

#DB 設定
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
#↓下記変更箇所、先頭の#を消し、AWS の環境に合わせて、xxxx.の部分を変更し、コメントを外す
spring.datasource.url=jdbc:oracle:thin:@//127.0.0.1:1521/freepdb1

spring.datasource.username=prosta_user
spring.datasource.password=prosta