<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout_4block :: layout(~{::body/content()})}">
<head>
<title>フレンド対戦</title>
<meta charset="UTF-8" />
</head>
<body>
<h3>フレンド対戦</h3>
<div class="friends-page" th:with="c=${challenge}">
  <p th:if="${noticeMessage}" class="notice-message" th:text="${noticeMessage}"></p>
  <p th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></p>
  <div th:if="${newAchievements}" class="notice-message">
    <span>新しい実績を獲得しました：</span>
    <span th:each="a, st : ${newAchievements}" th:text="${a.achievementName} + (${st.last} ? '' : '、')"></span>
  </div>

  <section class="friends-card">
    <p>
      <span th:text="${c.myName}"></span> vs <span th:text="${c.opponentName}"></span>
      ／ カテゴリ：<span th:text="${c.categoryName}"></span>
      ／ 難易度：<span th:text="${c.difficulty == 1 ? '★☆☆' : (c.difficulty == 2 ? '★★☆' : '★★★')}"></span>
      ／ <span th:text="${c.questionCount} + '問'"></span>
    </p>
  </section>

  <th:block th:if="${c.phase.name() == 'ANSWERING'}">
    <form th:action="@{/challenges/{id}/submit(id=${c.challengeId})}" method="post">
      <p>すべての問題に解答して提出してください。提出は1回だけです。</p>
      <div class="form_group" th:each="q : ${c.questions}">
        <div class="question_row">
          <span class="label" th:text="'問題' + ${q.position} + ':'"></span>
          <span th:text="${q.questionText}"></span>
        </div>
        <div class="ans_row">
          <span class="label">選択肢：</span>
          <label class="option_item">A <input type="radio" th:name="'answer' + ${q.position}" value="1"
                 th:checked="${selected[q.position] == 1}"/> <span th:text="${q.optionA}"></span></label>
          <label class="option_item">B <input type="radio" th:name="'answer' + ${q.position}" value="2"
                 th:checked="${selected[q.position] == 2}"/> <span th:text="${q.optionB}"></span></label>
          <label class="option_item">C <input type="radio" th:name="'answer' + ${q.position}" value="3"
                 th:checked="${selected[q.position] == 3}"/> <span th:text="${q.optionC}"></span></label>
          <label class="option_item">D <input type="radio" th:name="'answer' + ${q.position}" value="4"
                 th:checked="${selected[q.position] == 4}"/> わからない</label>
        </div>
      </div>
      <div class="button-area">
        <div class="inputselect"><input type="submit" value="提出する" /></div>
      </div>
    </form>
  </th:block>

  <section class="friends-card" th:if="${c.phase.name() == 'WAITING'}">
    <p>提出済みです。あなたの正解数：<strong th:text="${c.myCorrect} + ' / ' + ${c.questionCount}"></strong></p>
    <p th:text="${c.opponentName} + ' さんの提出を待っています。結果と正解は2人とも提出した後に表示されます。'"></p>
  </section>

  <th:block th:if="${c.phase.name() == 'COMPLETED'}">
    <section class="friends-card">
      <h4 th:text="${c.outcome}"></h4>
      <p>
        <span th:text="${c.myName}"></span>：<strong th:text="${c.myCorrect} + ' / ' + ${c.questionCount}"></strong>
        ／ <span th:text="${c.opponentName}"></span>：<strong th:text="${c.opponentCorrect} + ' / ' + ${c.questionCount}"></strong>
      </p>
    </section>
    <div class="form_group" th:each="r : ${c.results}">
      <div class="question_row">
        <span class="label" th:text="'問題' + ${r.position} + ':'"></span>
        <span th:text="${r.questionText}"></span>
      </div>
      <div class="ans_row">
        <span>A：<span th:text="${r.optionA}"></span></span>
        <span>B：<span th:text="${r.optionB}"></span></span>
        <span>C：<span th:text="${r.optionC}"></span></span>
      </div>
      <div class="ans_row">
        <span>正解：<span th:text="${r.correctOption == 1 ? 'A' : (r.correctOption == 2 ? 'B' : 'C')}"></span></span>
        <span>あなた：<span th:text="${r.myOption == null ? '-' : (r.myOption == 1 ? 'A' : (r.myOption == 2 ? 'B' : (r.myOption == 3 ? 'C' : 'わからない')))}"></span>
          <span th:class="${r.myCorrect} ? 'correct-mark' : 'wrong-mark'" th:text="${r.myCorrect} ? '○' : '×'"></span></span>
        <span>相手：<span th:text="${r.opponentOption == null ? '-' : (r.opponentOption == 1 ? 'A' : (r.opponentOption == 2 ? 'B' : (r.opponentOption == 3 ? 'C' : 'わからない')))}"></span>
          <span th:class="${r.opponentCorrect} ? 'correct-mark' : 'wrong-mark'" th:text="${r.opponentCorrect} ? '○' : '×'"></span></span>
      </div>
      <div class="ans_row" th:if="${r.explanation}">
        <span>解説：<span th:text="${r.explanation}"></span></span>
      </div>
    </div>
  </th:block>

  <div class="button-area">
    <a class="btn" th:href="@{/challenges}">対戦一覧へ戻る</a>
  </div>
</div>
</body>
</html>
