<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout_4block :: layout(~{::body/content()})}">
<head>
<meta charset="UTF-8">
<title>背景変更</title>
</head>

<body>

<h3>背景変更</h3>

<div class="background-list">

<p>カスタムカラーを設定</p>

<form th:action="@{/background/changeColor}" method="post">

    <label class="bg-card color-card">

        <input
            type="color"
            id="backgroundColor"
            name="backgroundColor"
            th:value="${backgroundColor != null ? backgroundColor : '#0B346E'}">

        <div class="color-preview" id="colorPreview"></div>

        <span>好きな色</span>

    </label>

    <button type="submit" class="btn">
        適用
    </button>

</form>

<p>背景を画像から選択</p>
     <form th:action="@{/background/change}"
      method="post"
      class="background-grid">
      
        <!-- Lv1～ -->
    <button
        type="submit"
        name="background"
        value="bg-grass"
        class="bg-card">

        <img th:src="@{/images/bg_grass.jpg}">
        <span>宇宙</span>

    </button>

        <!-- Lv10～ -->
    <button
        th:if="${level >= 10}"
        type="submit"
        name="background"
        value="bg-mori"
        class="bg-card">

        <img th:src="@{/images/mori.jpg}">
        <span>森</span>

    </button>

        <!-- Lv25～ -->
    <button
        th:if="${level >= 25}"
        type="submit"
        name="background"
        value="bg-sky"
        class="bg-card">

        <img th:src="@{/images/bg_sky.jpg}">
        <span>青空</span>

    </button>

        <!-- Lv50～ -->
    <button
        th:if="${level >= 50}"
        type="submit"
        name="background"
        value="bg-game"
        class="bg-card">

        <img th:src="@{/images/game.jpg}">
        <span>ゲーム</span>

    </button>

        <!-- Lv75～ -->
    <button
        th:if="${level >= 75}"
        type="submit"
        name="background"
        value="bg-forest"
        class="bg-card">

        <img th:src="@{/images/bg_forest.jpg}">
        <span>魔法の森</span>

    </button>

        <!-- Lv100～ -->
    <button
        th:if="${level >= 100}"
        type="submit"
        name="background"
        value="bg-castle"
        class="bg-card">

        <img th:src="@{/images/bg-castle.jpg}">
        <span>星界</span>

    </button>


    </form>

</div>
<script>
document.addEventListener("DOMContentLoaded", () => {

    const colorCard =
        document.querySelector(".color-card");

    const colorPicker =
        document.getElementById("backgroundColor");

    const preview =
        document.getElementById("colorPreview");

    preview.style.backgroundColor =
        colorPicker.value;

    colorCard.addEventListener("click", () => {

        colorPicker.click();

    });

    colorPicker.addEventListener("change", () => {

        preview.style.backgroundColor =
            colorPicker.value;

    });

});
</script>
</body>
</html>
