<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout_4block :: layout(~{::body/content()})}">
<head>
<meta charset="UTF-8">
<title>背景変更</title>
</head>

<body>

<h3>背景変更</h3>

<div class="background-list">

<form th:action="@{/background/default}" method="post">

    <button
        type="submit"
        class="btn">

        デフォルトに戻す

    </button>

</form>

<p>カスタムカラーを設定</p>

<form th:action="@{/background/changeColor}" method="post">

    <label class="bg-card color-card">

        <input
            type="color"
            id="backgroundColor"
            name="backgroundColor"
            th:value="${backgroundColor != null ? backgroundColor : '#0B346E'}">

        <div class="color-preview" id="colorPreview"></div>

        <span>好きな色</span>

    </label>

    <button type="submit" class="btn">
        適用
    </button>

</form>

<p>背景を画像から選択</p>
     <form th:action="@{/background/change}"
      method="post"
      class="background-grid">
      
        <!-- Lv1～ -->
   <button
        type="submit"
        name="background"
        value="bg-sky"
        class="bg-card">

        <img th:src="@{/images/bg_sky.jpg}">
        <span>キラキラ（ピンク）</span>

    </button>

<!-- Lv10～ -->
       <th:block th:if="${level >= 10}">
        <button
            type="submit"
            name="background"
            value="bg-castle"
            class="bg-card">

            <img th:src="@{/images/bg_castle.jpg}">
            <span>キラキラ（青）</span>

        </button>
        </th:block>
        <th:block th:unless="${level >= 10}">
        <div class="bg-card ach-locked bg-locked-card">

        <div class="ach-card-icon ach-locked-icon">🔒</div>

        <div class="ach-card-name">???</div>

        <div class="ach-card-desc">
            Lv10で解放
        </div>

       <div class="ach-card-badge ach-badge-locked">
        未解除
       </div>

       </div>
       </th:block>

<!-- Lv25～ -->
        <th:block th:if="${level >= 25}">
        <button
            type="submit"
            name="background"
            value="bg-grass"
            class="bg-card">

            <img th:src="@{/images/bg_grass.jpg}">
            <span>宇宙（ピンク）</span>

        </button>
        </th:block>
        
        <th:block th:unless="${level >= 25}">
        <div class="bg-card ach-locked bg-locked-card">

        <div class="ach-card-icon ach-locked-icon">🔒</div>

        <div class="ach-card-name">???</div>

        <div class="ach-card-desc">
            Lv25で解放
        </div>

       <div class="ach-card-badge ach-badge-locked">
        未解除
       </div>

       </div>
       </th:block>

<!-- Lv50～ -->
    <th:block th:if="${level >= 50}">
        <button
            type="submit"
            name="background"
            value="bg-forest"
            class="bg-card">

            <img th:src="@{/images/bg_forest.jpg}">
            <span>宇宙（青）</span>

        </button>
        </th:block>
        <th:block th:unless="${level >= 50}">
        <div class="bg-card ach-locked bg-locked-card">

        <div class="ach-card-icon ach-locked-icon">🔒</div>

        <div class="ach-card-name">???</div>

        <div class="ach-card-desc">
            Lv50で解放
        </div>

       <div class="ach-card-badge ach-badge-locked">
        未解除
       </div>

       </div>
       </th:block>

<!-- Lv75～ -->
    <th:block th:if="${level >= 75}">
    <button
        th:if="${level >= 75}"
        type="submit"
        name="background"
        value="bg-mori"
        class="bg-card">

        <img th:src="@{/images/mori.jpg}">
        <span>森</span>

    </button>
    </th:block>
    <th:block th:unless="${level >= 75}">
        <div class="bg-card ach-locked bg-locked-card">

        <div class="ach-card-icon ach-locked-icon">🔒</div>

        <div class="ach-card-name">???</div>

        <div class="ach-card-desc">
            Lv75で解放
        </div>

       <div class="ach-card-badge ach-badge-locked">
        未解除
       </div>

       </div>
    </th:block>

<!-- Lv100～ -->
        <th:block th:if="${level >= 100}">
        <button
            th:if="${level >= 100}"
            type="submit"
            name="background"
            value="bg-game"
            class="bg-card">

            <img th:src="@{/images/game.jpg}">
            <span>ゲーム</span>
        
        </button>
        </th:block>
        
        <th:block th:unless="${level >= 100}">
        <div class="bg-card ach-locked bg-locked-card">

        <div class="ach-card-icon ach-locked-icon">🔒</div>

        <div class="ach-card-name">???</div>

        <div class="ach-card-desc">
            Lv100で解放
        </div>

       <div class="ach-card-badge ach-badge-locked">
        未解除
       </div>

       </div>
       </th:block>


    </form>

</div>
<script>
document.addEventListener("DOMContentLoaded", () => {

    const colorCard =
        document.querySelector(".color-card");

    const colorPicker =
        document.getElementById("backgroundColor");

    const preview =
        document.getElementById("colorPreview");

    preview.style.backgroundColor =
        colorPicker.value;

    colorCard.addEventListener("click", () => {

        colorPicker.click();

    });

    colorPicker.addEventListener("change", () => {

        preview.style.backgroundColor =
            colorPicker.value;

    });

});
</script>
</body>
</html>
