<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout_4block :: layout(~{::body/content()})}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PROSTA | MyPage</title>
</head>
<body>
<main class="suku">
  <div class="mypage-header">
    <h3>My Page</h3>
    <div class="mypage-links">
      <a class="btn" th:href="@{/friends}"
         th:if="${session.user != null and session.user.permission == 0}">フレンド<span
         th:if="${pendingFriendRequestCount != null and pendingFriendRequestCount > 0}"
         class="notify-badge" th:text="${pendingFriendRequestCount}">1</span></a>
      <a class="btn" th:href="@{/user/update/input}">ユーザー更新</a>
      <a class="btn" th:href="@{/achievement}">実績一覧</a>
      <a class="btn" th:href="@{/background}">背景変更</a>
<!--</a>-->
<!--         th:if="${unreadAchievementCount != null and unreadAchievementCount > 0}"-->
<!--         class="notify-badge">NEW</span></a>-->
    </div>
  </div>

  <div class="status-panel">
    <div class="char-area">
      <div th:replace="~{common/character :: character(level=${currentLevel})}"></div>
    </div>

    <div class="status-info">
      <div class="level-badge">
        <span class="level-label">LEVEL</span>
        <span class="level-num" th:text="${currentLevel}">1</span>
      </div>
      <div class="stats-row" style="margin-top:8px;">
        <div class="stat-chip">
          <span class="stat-icon">📅</span>
          ログイン日数 <strong th:text="${loginCount}">0</strong>日
        </div>
        <div class="stat-chip">
          <span class="stat-icon">✅</span>
          累計正解数 <strong th:text="${totalCorrect}">0</strong>問
        </div>
        <div class="stat-chip">
          <span class="stat-icon">⭐</span>
          満点回数 <strong th:text="${perfectCount}">0</strong>回
        </div>
      </div>
    </div>
  </div>

  <div th:if="${newAchievements != null and !#lists.isEmpty(newAchievements)}"
       class="achievement-toast">
    <div class="achievement-toast-inner">
      <span class="toast-icon">🎉</span>
      <span class="toast-title">実績解除！</span>
      <span th:each="ach : ${newAchievements}"
            th:text="${ach.icon + ' ' + ach.achievementName}"
            class="toast-item"></span>
    </div>
  </div>

  <div th:if="${achievements != null and !#lists.isEmpty(achievements)}" class="ach-preview">
    <div class="ach-preview-title">🏆 最近の実績</div>
    <div class="ach-chips">
      <span th:each="ua, stat : ${achievements}"
            th:if="${stat.index < 5}"
            class="ach-chip">
        <span th:text="${ua.achievement.icon}">🏆</span>
        <span th:text="${ua.achievement.achievementName}">名称</span>
      </span>
    </div>
  </div>

  <div class="center">解答履歴</div>
  <div id="pagination-container" class="pagination-container"></div>

  <form class="mypage-sort-form" th:action="@{/mypage}" method="get">
    <select class="mypage-sort" name="sort" onchange="this.form.submit()">
      <option th:value="1" th:selected="${sort == null or sort == 1}">新しい順</option>
      <option th:value="2" th:selected="${sort == 2}">古い順</option>
    </select>
  </form>

  <table id="ans-table" class="mypage-table" th:if="${!#lists.isEmpty(answerlist)}">
    <thead>
      <tr>
        <th class="category">カテゴリー</th>
        <th class="questionId">問題</th>
        <th class="ansOption">選択履歴</th>
        <th class="correctOption">正解選択肢</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="ans : ${answerlist}">
        <td class="center"
            th:switch="${ans.question.category.categoryId}">
          <span th:case="1">Java</span>
          <span th:case="2">Spring</span>
          <span th:case="3">HTML</span>
          <span th:case="4">SQL</span>
        </td>
        <td class="question-cell">
          <button type="button" class="question-link"
                  th:data-question="${ans.question.questionText}"
                  th:data-option-a="${ans.question.optionA}"
                  th:data-option-b="${ans.question.optionB}"
                  th:data-option-c="${ans.question.optionC}"
                  th:data-correct="${ans.correctOption}"
                  th:data-chosen="${ans.ansOption}"
                  th:data-explanation="${ans.question.explanation}"
                  th:text="${ans.question.questionText}"></button>
        </td>
        <td class="center" th:switch="${ans.ansOption}">
          <span th:case="1">A</span>
          <span th:case="2">B</span>
          <span th:case="3">C</span>
          <span th:case="4">わからない</span>
        </td>
        <td class="center" th:switch="${ans.correctOption}">
          <span th:case="1">A</span>
          <span th:case="2">B</span>
          <span th:case="3">C</span>
        </td>
      </tr>
    </tbody>
  </table>
  <p class="center" th:if="${#lists.isEmpty(answerlist)}">履歴がありません。</p>

  <div id="question-modal" class="question-modal" hidden>
    <div class="question-modal-backdrop" data-close="true"></div>
    <div class="question-modal-body" role="dialog" aria-modal="true" aria-labelledby="question-modal-text">
      <button type="button" class="question-modal-close" data-close="true" aria-label="閉じる">×</button>
      <p id="question-modal-text" class="question-modal-text"></p>
      <ul id="question-modal-options" class="question-modal-options"></ul>
      <p id="question-modal-result" class="question-modal-result"></p>
      <p id="question-modal-explanation" class="question-modal-explanation"></p>
    </div>
  </div>

  <div th:replace="~{common/chatbot :: chatbot}"></div>
</main>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const rowsPerPage = 6;
  const table = document.getElementById('ans-table');
  if (table) {
    const rows = table.querySelectorAll('tbody tr');
    const pageCount = Math.ceil(rows.length / rowsPerPage);
    const container = document.getElementById('pagination-container');
    if (pageCount > 1) {
      let currentPage = 1;
      function showPage(page) {
        currentPage = page;
        const start = (page - 1) * rowsPerPage;
        const end = start + rowsPerPage;
        Array.from(rows).forEach((row, index) => {
          row.style.display = (index >= start && index < end) ? '' : 'none';
        });
        document.getElementById('p-prev').disabled = currentPage === 1;
        document.getElementById('p-next').disabled = currentPage === pageCount;
      }
      const prev = document.createElement('button');
      prev.id = 'p-prev';
      prev.type = 'button';
      prev.innerText = '前へ';
      prev.className = 'btn-pagination';
      prev.addEventListener('click', () => {
        if (currentPage > 1) showPage(currentPage - 1);
      });
      const next = document.createElement('button');
      next.id = 'p-next';
      next.type = 'button';
      next.innerText = '次へ';
      next.className = 'btn-pagination';
      next.addEventListener('click', () => {
        if (currentPage < pageCount) showPage(currentPage + 1);
      });
      container.appendChild(prev);
      container.appendChild(next);
      showPage(1);
    }
  }

  const modal = document.getElementById('question-modal');
  if (modal) {
    const labels = ['A', 'B', 'C'];
    const textEl = document.getElementById('question-modal-text');
    const optionsEl = document.getElementById('question-modal-options');
    const resultEl = document.getElementById('question-modal-result');
    const explanationEl = document.getElementById('question-modal-explanation');

    function closeModal() {
      modal.hidden = true;
    }

    function openModal(btn) {
      const correct = Number(btn.dataset.correct);
      const chosen = Number(btn.dataset.chosen);
      const options = [btn.dataset.optionA, btn.dataset.optionB, btn.dataset.optionC];

      textEl.textContent = btn.dataset.question;
      optionsEl.replaceChildren();
      options.forEach((text, i) => {
        const no = i + 1;
        const li = document.createElement('li');
        const tags = [];
        if (no === correct) {
          li.classList.add('is-correct');
          tags.push('正解');
        }
        if (no === chosen) {
          li.classList.add('is-chosen');
          tags.push('あなたの解答');
        }
        li.textContent = labels[i] + '. ' + text + (tags.length ? '  [' + tags.join(' / ') + ']' : '');
        optionsEl.appendChild(li);
      });

      if (chosen === 4) {
        resultEl.textContent = '解答：わからない';
      } else {
        resultEl.textContent = chosen === correct ? '正解でした' : '不正解でした';
      }
      resultEl.className = 'question-modal-result ' + (chosen === correct ? 'ok' : 'ng');
      explanationEl.textContent = '解説：' + (btn.dataset.explanation || '解説はまだ登録されていません。');
      modal.hidden = false;
    }

    document.querySelectorAll('.question-link').forEach((btn) => {
      btn.addEventListener('click', () => openModal(btn));
    });
    modal.addEventListener('click', (e) => {
      if (e.target.dataset.close) closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !modal.hidden) closeModal();
    });
  }

  const toast = document.querySelector('.achievement-toast');
  if (toast) {
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateY(-30px)';
    }, 4000);
    setTimeout(() => {
      toast.style.display = 'none';
    }, 4600);
  }
});
</script>
</body>
</html>
