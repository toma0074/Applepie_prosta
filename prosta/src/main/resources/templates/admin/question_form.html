<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout_4block :: layout(~{::body/content()})}">
<head>
<title>問題登録・編集</title>
<meta charset="UTF-8" />
</head>
<body>
<div class="aq-form">
  <h3 th:text="${creating} ? '新規問題登録' : '問題編集'"></h3>
  <form th:action="@{/admin/questions/save}" th:object="${questionForm}" method="post">
    <input type="hidden" th:field="*{questionId}" />

    <div class="row">
      <label for="category">カテゴリー</label>
      <select id="category" th:field="*{category}">
        <option value="">選択してください</option>
        <option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.categoryName}"></option>
      </select>
      <span class="err" th:errors="*{category}"></span>
    </div>

    <div class="row">
      <label for="difficulty">難易度</label>
      <select id="difficulty" th:field="*{difficulty}">
        <option value="1">★☆☆</option>
        <option value="2">★★☆</option>
        <option value="3">★★★</option>
      </select>
      <span class="err" th:errors="*{difficulty}"></span>
    </div>

    <div class="row">
      <label for="questionText">問題文</label>
      <textarea id="questionText" rows="4" th:field="*{questionText}"></textarea>
      <span class="err" th:errors="*{questionText}"></span>
    </div>

    <div class="row">
      <label for="optionA">選択肢A</label>
      <input type="text" id="optionA" th:field="*{optionA}" />
      <span class="err" th:errors="*{optionA}"></span>
    </div>
    <div class="row">
      <label for="optionB">選択肢B</label>
      <input type="text" id="optionB" th:field="*{optionB}" />
      <span class="err" th:errors="*{optionB}"></span>
    </div>
    <div class="row">
      <label for="optionC">選択肢C</label>
      <input type="text" id="optionC" th:field="*{optionC}" />
      <span class="err" th:errors="*{optionC}"></span>
    </div>

    <div class="row">
      <span>正解</span>
      <div class="inline">
        <label><input type="radio" th:field="*{correctOption}" value="1" /> A</label>
        <label><input type="radio" th:field="*{correctOption}" value="2" /> B</label>
        <label><input type="radio" th:field="*{correctOption}" value="3" /> C</label>
      </div>
      <span class="err" th:errors="*{correctOption}"></span>
    </div>

    <div class="row">
      <label for="explanation">解説（任意・チャットボットでも参照されます）</label>
      <textarea id="explanation" rows="4" th:field="*{explanation}"></textarea>
      <span class="err" th:errors="*{explanation}"></span>
    </div>

    <div class="buttons">
      <input type="button" value="戻る" th:onclick="|location.href='@{/admin/questions}'|" />
      <input type="submit" value="保存" />
    </div>
  </form>
</div>
</body>
</html>
