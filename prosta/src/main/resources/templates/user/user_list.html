<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{common/layout_5block :: layout(~{::body/content()})}">

<head>
	<title>ユーザー一覧</title>
	<meta charset="UTF-8" />
	<script src="https://jquery.com"></script>
	<script src="https://cloudflare.com"></script>
</head>

<body ><!--class="admin user_list"-->
	<h3>ユーザー一覧</h3>
	
<!--	<p>-->
		<th:block th:if="${errorMessage}">
			<th:block th:if="${errorMessage}">
			<span th:text="${errorMessage}" style="margin-left: 20px;">
				<p class="btn"><a th:href="@{/user/list}" th:text="${back}"></a></p>
			</span>
			</th:block>
		</th:block>
<!--	</p>-->

	<th:block th:if="${#lists.size(customerForm) == 0}">
		<div class="message">
			<p class="center">該当するユーザー情報がありません</p>
			<p class="btn"><a th:href = "@{/user/list}">ユーザー一覧に戻る</a></p>
		</div>
	</th:block>
	
	<div id="pagination-container" style="display: flex; gap: 5px; justify-content: center; margin-top: 5px;"></div>
	
	<table id="user-table" class="list_table" th:if="${#lists.size(customerForm) != 0}">
		<thead>
		<tr>
			<th class="userId">ユーザーID</th>
			<th class="userName">名前</th>
			<th class="permission">管理者権限</th>
			<th class="deleteFlag">状態</th>
			
			<th class="button" colspan="3">操作</th>
		</tr>
		</thead>
		
		<tbody>
		<tr th:each="user,count:${customerForm}">
			<td th:text = "${user.userId}"></td>
			<td th:text = "${user.userName}"></td>
			<td th:if = "${user.permission == 1}">一般</td>
			<td th:if = "${user.permission == 2}">管理者</td>
			<td th:if = "${user.deleteFlag == 0}">アクティブ</td>
			<td th:if = "${user.deleteFlag == 1}">削除済み</td>
			<td class="button">
				<form class="center" th:action="@{/user/update/input}" method="get">
					<input type="hidden" name="userId" th:value="${user.userId}" />
					<input type="hidden" name="userName" th:value="${user.userName}" />
					<input type="hidden" name="userPass" th:value="${user.userPass}" />
					<input type="hidden" name="permission" th:value="${user.permission}" />
					<input type="hidden" name="deleteFlag" th:value="${user.deleteFlag}" />
					<input type="submit" value="変更" class="update"/>
				</form>
			</td>
		
			<td class="button">
				<form class="center" th:action="@{/user/delete/check}" method="post">
					<input type="hidden" name="userId" th:value="${user.userId}" />
					<input type="hidden" name="userName" th:value="${user.userName}" />
					<input type="hidden" name="userPass" th:value="${user.userPass}" />
					<input type="hidden" name="permission" th:value="${user.permission}" />
					<input type="hidden" name="deleteFlag" th:value="${user.deleteFlag}" />
					<input type="submit" value="削除" class="delete" />
				</form>
			</td>
			<td class="button">
				<form class="center" th:action="@{/user/restore/check}" method="post">
					<input type="hidden" name="userId" th:value="${user.userId}" />
					<input type="hidden" name="userName" th:value="${user.userName}" />
					<input type="hidden" name="userPass" th:value="${user.userPass}" />
					<input type="hidden" name="permission" th:value="${user.permission}" />
					<input type="hidden" name="deleteFlag" th:value="${user.deleteFlag}" />
					<input type="submit" value="復元" class="delete" />
				</form>
			</td>
		</tr>
		</tbody>
	</table>

	<script>
	document.addEventListener('DOMContentLoaded', function() {
	  const rowsPerPage = 8;
	  const table = document.getElementById('user-table');
	  if (!table) return;
	
	  const rows = table.querySelectorAll('tbody tr');
	  const pageCount = Math.ceil(rows.length / rowsPerPage);
	  const container = document.getElementById('pagination-container');
	  if (pageCount <= 1) return;
	  let currentPage = 1;
	
	  function showPage(page) {
	    currentPage = page;
	    const start = (page - 1) * rowsPerPage;
	    const end = start + rowsPerPage;
	    
	    Array.from(rows).forEach((row, i) => row.style.display = (i >= start && i < end) ? '' : 'none');
	    document.getElementById('p-prev').disabled = (currentPage === 1);
	    document.getElementById('p-next').disabled = (currentPage === pageCount);
	  }
	  const prevButton = document.createElement('button');
	  prevButton.id = 'p-prev';
	  prevButton.type='button';
	  prevButton.innerText = '前へ';
	  prevButton.className = 'p-btm';
	  prevButton.addEventListener('click', () => {
	    if (currentPage > 1) showPage(currentPage - 1);
	  });
	
	  const nextButton = document.createElement('button');
	  nextButton.id = 'p-next';
	  nextButton.type='button';
	  nextButton.innerText = '次へ';
	  nextButton.className = 'p-btm';
	  nextButton.addEventListener('click', () => {
	    if (currentPage < pageCount) showPage(currentPage + 1);
	  });
	
	  container.appendChild(prevButton);
	  container.appendChild(nextButton);
	
	  showPage(1);
	});
	</script>

</body>

</html>
