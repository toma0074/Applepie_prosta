<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout_4block :: layout(~{::body/content()})}">
<head>
<meta charset="UTF-8">
<title>ユーザー削除確認</title>
</head>
<body>
<h3>ユーザー削除確認</h3>
<form th:action="@{/user/delete/complete}" method="post" th:object="${customerForm}">

    <div class="message">
        <p class="text-center" th:text="${flag}"></p>
        <p class="text-center" th:text="*{userName} + 'さん'"></p>
    </div>

    <input type="hidden" name="userId" th:value="${customerForm.userId}">
    <div class="button-area">
    <div class="inputselect">
        <input type="submit" value="確定" />
    </div>
</div>

</form>
<form th:action="@{/user/list}" method="GET">
  <div class="button-area">
    <div class="inputselect">
        <input type="submit" value="戻る" />
    </div>
</div>
</form>
</body>
</html>
