<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout_3block :: layout(~{::body/content()})}">
<head>
<title>問題確認画面</title>
<meta charset="UTF-8" />
</head>
<body>
<h3>問題確認画面</h3>
<div class="test_ans">
  <form class="center_list" th:action="@{/test/result}" method="post" id="question-table">
    <div class="form_group" th:each="a,count : ${session.ans}">
      <div class="question_row">
        <span class="label" th:text="'問題' + ${count.count} + '：'"></span>
        <span th:text="${a.questionText}"></span>
      </div>
      <div class="ans_row">
        <span class="label">選んだ選択肢：</span>
        <span th:if="${a.ansOption == 1}" th:text="${a.optionA}"></span>
        <span th:if="${a.ansOption == 2}" th:text="${a.optionB}"></span>
        <span th:if="${a.ansOption == 3}" th:text="${a.optionC}"></span>
        <span th:if="${a.ansOption == 4}">わからない</span>
      </div>
    </div>

    <div id="pagination-container" style="display:flex;gap:5px;justify-content:center;margin-top:5px;"></div>

    <div class="inputform">
      <div class="inputselect">
        <input type="submit" value="送信" />
      </div>
    </div>
  </form>

  <form th:action="@{/test/back}" method="post">
    <div class="inputselect">
      <input type="submit" value="戻る" />
    </div>
  </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const rowsPerPage = 3;
  const table = document.getElementById('question-table');
  if (!table) return;
  const rows = table.querySelectorAll('.form_group');
  const pageCount = Math.ceil(rows.length / rowsPerPage);
  const container = document.getElementById('pagination-container');
  if (pageCount <= 1) return;
  let currentPage = 1;
  function showPage(page) {
    currentPage = page;
    const start = (page - 1) * rowsPerPage;
    const end = start + rowsPerPage;
    Array.from(rows).forEach((r, i) => r.style.display = (i >= start && i < end) ? '' : 'none');
    document.getElementById('p-prev').disabled = (currentPage === 1);
    document.getElementById('p-next').disabled = (currentPage === pageCount);
  }
  const prev = document.createElement('button');
  prev.id = 'p-prev'; prev.type = 'button'; prev.innerText = '前へ'; prev.className = 'p-btm';
  prev.addEventListener('click', () => { if (currentPage > 1) showPage(currentPage - 1); });
  const next = document.createElement('button');
  next.id = 'p-next'; next.type = 'button'; next.innerText = '次へ'; next.className = 'p-btm';
  next.addEventListener('click', () => { if (currentPage < pageCount) showPage(currentPage + 1); });
  container.appendChild(prev);
  container.appendChild(next);
  showPage(1);
});
</script>
</body>
</html>
