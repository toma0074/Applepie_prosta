<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout_3block :: layout(~{::body/content()})}">
<head>
<title>問題確認画面</title>
<meta charset="UTF-8" />
</head>
<body>
<h3>問題確認画面</h3>
<div th:replace="~{common/timer :: timer('confirm')}"></div>
<div>
  <form th:action="@{/test/result}" method="post" id="question-table">
    <div class="form_group" th:each="a,count : ${session.ans}">
      <div class="question_row">
        <span class="label" th:text="'問題' + ${count.count} + '：'"></span>
        <span th:text="${a.questionText}"></span>
      </div>
      <div class="ans_row">
        <span class="label">選んだ選択肢：</span>
        <span th:if="${a.ansOption == 1}" th:text="${a.optionA}"></span>
        <span th:if="${a.ansOption == 2}" th:text="${a.optionB}"></span>
        <span th:if="${a.ansOption == 3}" th:text="${a.optionC}"></span>
        <span th:if="${a.ansOption == 4}">わからない</span>
      </div>
    </div>

    <div id="pagination-container" class="pagination-container"
         data-pagination-target="question-table" data-pagination-rows=".form_group" data-pagination-size="3"></div>
    <div class="button-area">
    <div class="inputselect">
        <input type="submit" th:formaction="@{/test/back}" formmethod="post" value="戻る" />
        <input type="submit" value="送信" />
    </div>
    </div>
  </form>
</div>

</body>
</html>
