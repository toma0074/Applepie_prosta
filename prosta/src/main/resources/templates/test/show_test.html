<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout_3block :: layout(~{::body/content()})}">
<head>
<title>問題解答画面</title>
<meta charset="UTF-8" />
</head>
<body>
<h3>問題解答画面</h3>

<!-- タイマーと試験中キャラクターを右上に固定 -->
<div class="exam-fixed-tools">

    <!-- タイマー：有効な場合だけ表示 -->
    <div th:replace="~{common/timer :: timer('answer')}"></div>

    <!-- 試験中のキャラクター -->
    <div class="exam-character">
        <img th:src="@{/images/suta_learn.png}"
             alt="学習中のキャラクター">
    </div>

</div>

<div>
  <form id="answer-form" th:action="@{/test/check}" method="post" th:object="${answerListForm}">
    <p class="error-message">
      <th:block th:each="error,status : *{results}">
        <span th:if="${#fields.hasErrors('results[' + status.index + '].ansOption')}"
              th:text="'第' + ${status.count} + '問目を入力してください'" class="error-message"></span><br/>
      </th:block>
    </p>

    <div id="question-table">
      <div class="form_group" th:each="q,count : ${session.question}">
        <div class="question_row">
          <span class="label" th:text="'問題' + ${count.count} + ':'"></span>
          <span th:text="${q.questionText}"></span>
        </div>
        <div class="ans_row">
          <span class="label">選択肢：</span>
          <label class="option_item">
            A <input type="radio"
                     th:name="'results[' + ${count.index} + '].ansOption'" value="1"
                     th:checked="${session.ans[count.index].ansOption == 1}"/>
            <span th:text="${q.optionA}"></span>
          </label>
          <label class="option_item">
            B <input type="radio"
                     th:name="'results[' + ${count.index} + '].ansOption'" value="2"
                     th:checked="${session.ans[count.index].ansOption == 2}"/>
            <span th:text="${q.optionB}"></span>
          </label>
          <label class="option_item">
            C <input type="radio"
                     th:name="'results[' + ${count.index} + '].ansOption'" value="3"
                     th:checked="${session.ans[count.index].ansOption == 3}"/>
            <span th:text="${q.optionC}"></span>
          </label>
          <label class="option_item">
            D <input type="radio"
                     th:name="'results[' + ${count.index} + '].ansOption'" value="4"
                     th:checked="${session.ans[count.index].ansOption == 4}"/>
            わからない
          </label>
        </div>
        <input type="hidden" th:name="'results[' + ${count.index} + '].questionId'"    th:value="${q.questionId}"/>
        <input type="hidden" th:name="'results[' + ${count.index} + '].category'"      th:value="${q.category != null ? q.category.categoryId : 0}"/>
        <input type="hidden" th:name="'results[' + ${count.index} + '].correctOption'" th:value="${q.correctOption}"/>
        <input type="hidden" th:name="'results[' + ${count.index} + '].questionText'"  th:value="${q.questionText}"/>
        <input type="hidden" th:name="'results[' + ${count.index} + '].optionA'"       th:value="${q.optionA}"/>
        <input type="hidden" th:name="'results[' + ${count.index} + '].optionB'"       th:value="${q.optionB}"/>
        <input type="hidden" th:name="'results[' + ${count.index} + '].optionC'"       th:value="${q.optionC}"/>
      </div>
    </div>

    <div id="pagination-container"
     class="pagination-container"
     data-pagination-target="question-table" data-pagination-rows=".form_group" data-pagination-size="3">
     </div>

    <div class="button-area">
    <div class="inputselect">
        <input type="submit" value="確認" />
    </div>
    </div>
  </form>
</div>

</body>
</html>
