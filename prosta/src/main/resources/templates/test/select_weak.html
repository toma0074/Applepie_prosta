<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout_4block :: layout(~{::body/content()})}">
<head>
<title>弱点問題</title>
<meta charset="UTF-8" />
</head>
<body>
<h3>弱点問題選択画面</h3>
<div class="selection-guide">
    <div class="selection-speech-bubble">苦手な問題をくり返して、得意に変えていこう！</div>
    <img th:src="@{/images/suta_teach.png}"
         alt="問題選択を案内するキャラクター">
</div>
<div class="test_select">
  <p>これまでの解答履歴から、正答率の低い問題を最大15問出題します。<br/>
     （<span th:text="${minAttempts}">2</span>回以上解答していて、全問正解ではない問題が対象です）</p>

  <th:block th:if="${#lists.isEmpty(weakList)}">
    <p>対象の問題がまだありません。カテゴリ別問題などに挑戦して、解答履歴を増やしましょう。</p>
  </th:block>

  <th:block th:unless="${#lists.isEmpty(weakList)}">
    <table class="weak-table">
      <thead>
        <tr><th>カテゴリ</th><th>問題文</th><th>解答数</th><th>正解数</th><th>正答率</th></tr>
      </thead>
      <tbody>
        <tr th:each="w : ${weakList}">
          <td th:text="${w.question.category != null ? w.question.category.categoryName : '未分類'}"></td>
          <td th:text="${w.question.questionText}"></td>
          <td th:text="${w.attempts}"></td>
          <td th:text="${w.correct}"></td>
          <td th:text="${w.percent} + '%'"></td>
        </tr>
      </tbody>
    </table>
    <form th:action="@{/test/weak/start}" method="get">
      <div class="form">
        <label><input type="checkbox" name="timer" value="true" /> タイマーを使う（1問25秒）</label>
      </div>
      <div class="form">
        <div class="select">
          <input type="submit" th:formaction="@{/mypage}" formmethod="get" value="戻る" />
          <input type="submit" value="スタート" />
        </div>
      </div>
    </form>
  </th:block>
  <th:block th:if="${#lists.isEmpty(weakList)}">
    <form th:action="@{/mypage}">
      <div class="form">
        <div class="select"><input type="submit" value="戻る" /></div>
      </div>
    </form>
  </th:block>
</div>
</body>
</html>
