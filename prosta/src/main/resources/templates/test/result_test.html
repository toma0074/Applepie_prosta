<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout_3block :: layout(~{::body/content()})}">
<head>
<title>テスト結果</title>
<meta charset="UTF-8" />
</head>
<body class="test_category_result">
<h3>テスト結果</h3>
<p th:if="${questRewardEarned == true}" class="achievement-toast">今日のクエスト全達成！追加で10 EXPを獲得しました。</p>

<!-- ===== 新規実績解除フラッシュ ===== -->
<div th:if="${newAchievements != null and !#lists.isEmpty(newAchievements)}" class="achievement-toast">
  <div class="achievement-toast-inner">
    <span class="toast-icon">🎉</span>
    <span class="toast-title">実績解除！</span>
    <span th:each="ach : ${newAchievements}"
          th:text="${ach.icon + ' ' + ach.achievementName}"
          class="toast-item"></span>
  </div>
</div>

<!-- ===== レベル変化パネル ===== -->


<!-- ===== EXP・Level・Sutaのパネル ===== -->
<div class="result-status-panel">

    <!-- EXPバーとLevel表示 -->
    <div class="exp-progress-component">

        <div class="exp-bar-label">
            累計EXP：
            <strong th:text="${totalExp}">0</strong> EXP
        </div>

        <div class="exp-bar-bg">
            <div class="exp-bar-fill"
                 th:style="'width:' + ${expProgressPercent} + '%'">
            </div>
        </div>

       <div class="result-level-row">

    <!-- Level表示：中央 -->
    <div class="result-level-center">
        <span class="result-level-change" th:if="${leveledUp}">
            <span class="level-value"
                  th:text="|Level ${previousLevel}|">Level 1</span>
            <span class="level-arrow">→</span>
            <span class="level-value"
                  th:text="|Level ${currentLevel}|">Level 2</span>
        </span>

        <span class="result-level-change"
              th:unless="${leveledUp}"
              th:text="|Level ${currentLevel}|">
            Level 1
        </span>
    </div>

    <!-- EXP詳細：右側 -->
    <div class="exp-bar-sub">
        <span th:text="${expInLevel}">0</span> / 15 EXP
        ・次のレベルまであと
        <span th:text="${expRemaining}">15</span> EXP
    </div>
  </div>
</div>

    <!-- 満点バッジ -->
    <div class="result-exp-gained">
        <span th:if="${isPerfect}" class="perfect-badge">
            🌟 満点！
        </span>
    </div>

    <!-- Sutaと吹き出し -->
    <div class="result-character"
         th:if="${displayCharacter != null}">

        <img th:src="@{/images/{filename}(filename=${displayCharacter})}"
             alt="Suta">

        <div class="result-speech-bubble"
             th:if="${characterMessage != null and !#strings.isEmpty(characterMessage)}"
             th:text="${characterMessage}">
            テストおつかれさま！
        </div>

    </div>

</div>

<!-- ===== 解答結果 ===== -->
<div class="test-result-answers">
  <div id="question-table">

    <div class="form_group" th:each="ans,count : ${ans}">
      <div class="question_row">
        <span class="label" th:text="'問題' + ${count.count} + '：'"></span>
        <button type="button" class="question-link"
                th:data-question="${ans.questionText}"
                th:data-option-a="${ans.optionA}"
                th:data-option-b="${ans.optionB}"
                th:data-option-c="${ans.optionC}"
                th:data-correct="${ans.correctOption}"
                th:data-chosen="${ans.ansOption}"
                th:data-explanation="${ans.explanation}"
                th:text="${ans.questionText}"></button>
      </div>
      <div class="ans_row">
        <span class="label">選んだ選択肢：</span>
        <span th:if="${ans.ansOption == 1}" th:text="|A: ${ans.optionA}|"></span>
        <span th:if="${ans.ansOption == 2}" th:text="|B: ${ans.optionB}|"></span>
        <span th:if="${ans.ansOption == 3}" th:text="|C: ${ans.optionC}|"></span>
        <span th:if="${ans.ansOption == 4}">わからない</span>
        <!-- 正誤マーク -->
        <span th:if="${ans.ansOption == ans.correctOption}" class="correct-mark">✔</span>
        <span th:if="${ans.ansOption != ans.correctOption and ans.ansOption != 4}" class="wrong-mark">✘</span>
      </div>
      <div class="ans_row">
        <span class="label">正解：</span>
        <span th:if="${ans.correctOption == 1}" th:text="|A: ${ans.optionA}|"></span>
        <span th:if="${ans.correctOption == 2}" th:text="|B: ${ans.optionB}|"></span>
        <span th:if="${ans.correctOption == 3}" th:text="|C: ${ans.optionC}|"></span>
      </div>
      <p th:if="${ans.previousAnswer != null}" th:text="${ans.previousAnswer}"></p>
      <p><strong>解説：</strong><span th:text="${#strings.isEmpty(ans.explanation) ? '解説はまだ登録されていません。' : ans.explanation}"></span></p>
      <form th:action="@{/favorite/toggle}" method="post">
        <input type="hidden" name="questionId" th:value="${ans.questionId}" />
        <input type="hidden" name="resultPage" value="true" />
        <button type="submit" class="btn"
                th:text="${favoriteIds != null and favoriteIds.contains(ans.questionId)} ? '★ 解除' : '☆ ブックマーク'"></button>
      </form>
      <p class="btn"><a th:href="@{/question/{id}/study(id=${ans.questionId},returnUrl='/test/result')}">学習メモ・問題報告</a></p>
    </div>

    <div id="pagination-container" class="pagination-container"
         data-pagination-target="question-table" data-pagination-rows=".form_group" data-pagination-size="3"></div>

    <div th:text="'正答数 ' + ${ca} + '/' + ${qc}"></div>

    <th:block th:if="${session.testFlag == null}">
      <p th:if="${cateCount[0] != 0}" th:text="${'Java : ' + cateCorrect[0] + '/' + cateCount[0]}"></p>
      <p th:if="${cateCount[1] != 0}" th:text="${'Spring : ' + cateCorrect[1] + '/' + cateCount[1]}"></p>
      <p th:if="${cateCount[2] != 0}" th:text="${'HTML : ' + cateCorrect[2] + '/' + cateCount[2]}"></p>
      <p th:if="${cateCount[3] != 0}" th:text="${'SQL : ' + cateCorrect[3] + '/' + cateCount[3]}"></p>
    </th:block>

    <div class="button-area">
    <div class="inputselect">
    <a class="btn" th:href="@{/mypage}">マイページに戻る</a>
    </div>
    </div>
  </div>
</div>


<div id="question-modal" class="question-modal" hidden>
  <div class="question-modal-backdrop" data-close="true"></div>
  <div class="question-modal-body" role="dialog" aria-modal="true" aria-labelledby="question-modal-text">
    <button type="button" class="question-modal-close" data-close="true" aria-label="閉じる">×</button>
    <p id="question-modal-text" class="question-modal-text"></p>
    <ul id="question-modal-options" class="question-modal-options"></ul>
    <p id="question-modal-result" class="question-modal-result"></p>
    <p id="question-modal-explanation" class="question-modal-explanation"></p>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  // ---- 問題文モーダル ----
  const modal = document.getElementById('question-modal');
  if (modal) {
    const labels = ['A', 'B', 'C'];
    const textEl = document.getElementById('question-modal-text');
    const optionsEl = document.getElementById('question-modal-options');
    const resultEl = document.getElementById('question-modal-result');
    const explanationEl = document.getElementById('question-modal-explanation');
    const closeModal = () => { modal.hidden = true; };

    function openModal(btn) {
      const correct = Number(btn.dataset.correct);
      const chosen = Number(btn.dataset.chosen);
      const options = [btn.dataset.optionA, btn.dataset.optionB, btn.dataset.optionC];
      textEl.textContent = btn.dataset.question;
      optionsEl.replaceChildren();
      options.forEach((text, i) => {
        const no = i + 1;
        const li = document.createElement('li');
        const tags = [];
        if (no === correct) { li.classList.add('is-correct'); tags.push('正解'); }
        if (no === chosen) { li.classList.add('is-chosen'); tags.push('あなたの解答'); }
        li.textContent = labels[i] + '. ' + text + (tags.length ? '  [' + tags.join(' / ') + ']' : '');
        optionsEl.appendChild(li);
      });
      resultEl.textContent = chosen === 4 ? '解答：わからない' : (chosen === correct ? '正解でした' : '不正解でした');
      resultEl.className = 'question-modal-result ' + (chosen === correct ? 'ok' : 'ng');
      explanationEl.textContent = '解説：' + (btn.dataset.explanation || '解説はまだ登録されていません。');
      modal.hidden = false;
    }

    document.querySelectorAll('.question-link').forEach((btn) => {
      btn.addEventListener('click', () => openModal(btn));
    });
    modal.addEventListener('click', (e) => { if (e.target.dataset.close) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !modal.hidden) closeModal(); });
  }

  // ---- 実績トースト自動非表示 ----
  const toast = document.querySelector('.achievement-toast');
  if (toast) {
    setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateY(-30px)'; }, 4000);
    setTimeout(() => { toast.style.display = 'none'; }, 4600);
  }
});
</script>
</body>
</html>
