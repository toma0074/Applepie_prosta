<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout_3block :: layout(~{::body/content()})}">
<head>
<title>テスト結果</title>
<meta charset="UTF-8" />
</head>
<body class="test_category_result">
<h3>テスト結果</h3>

<!-- ===== 新規実績解除フラッシュ ===== -->
<div th:if="${newAchievements != null and !#lists.isEmpty(newAchievements)}" class="achievement-toast">
  <div class="achievement-toast-inner">
    <span class="toast-icon">🎉</span>
    <span class="toast-title">実績解除！</span>
    <span th:each="ach : ${newAchievements}"
          th:text="${ach.icon + ' ' + ach.achievementName}"
          class="toast-item"></span>
  </div>
</div>

<!-- ===== レベルパネル ===== -->
<div class="result-status-panel">
  <div class="result-exp-gained">
    <span class="exp-gained-icon">✨</span>
    <span>現在レベル：<strong th:text="${currentLevel}">1</strong></span>
    <span th:if="${isPerfect}" class="perfect-badge">🌟 満点！</span>
  </div>
  <div class="stats-row" style="justify-content:center;margin-top:8px;">
    <div class="stat-chip">
      <span class="stat-icon">📅</span>
      ログイン日数 <strong th:text="${loginCount}">0</strong>日
    </div>
  </div>
</div>

<!-- ===== 解答結果 ===== -->
<div class="test_ans">
  <form th:action="@{/mypage}" method="get" id="question-table">

    <div class="form_group" th:each="ans,count : ${ans}">
      <div class="question_row">
        <span class="label" th:text="'問題' + ${count.count} + '：'"></span>
        <span th:text="${ans.questionText}"></span>
      </div>
      <div class="ans_row">
        <span class="label">選んだ選択肢：</span>
        <span th:if="${ans.ansOption == 1}">A</span>
        <span th:if="${ans.ansOption == 2}">B</span>
        <span th:if="${ans.ansOption == 3}">C</span>
        <span th:if="${ans.ansOption == 4}">わからない</span>
        <!-- 正誤マーク -->
        <span th:if="${ans.ansOption == ans.correctOption}" class="correct-mark">✔</span>
        <span th:if="${ans.ansOption != ans.correctOption and ans.ansOption != 4}" class="wrong-mark">✘</span>
      </div>
      <div class="ans_row">
        <span class="label">正解：</span>
        <span th:if="${ans.correctOption == 1}">A</span>
        <span th:if="${ans.correctOption == 2}">B</span>
        <span th:if="${ans.correctOption == 3}">C</span>
      </div>
    </div>

    <div id="pagination-container" style="display:flex;gap:5px;justify-content:center;margin-top:5px;"></div>

    <div th:text="'正答数 ' + ${ca} + '/' + ${qc}"></div>

    <th:block th:if="${session.testFlag == null}">
      <p th:if="${cateCount[0] != 0}" th:text="${'Java : ' + cateCorrect[0] + '/' + cateCount[0]}"></p>
      <p th:if="${cateCount[1] != 0}" th:text="${'Spring : ' + cateCorrect[1] + '/' + cateCount[1]}"></p>
      <p th:if="${cateCount[2] != 0}" th:text="${'HTML : ' + cateCorrect[2] + '/' + cateCount[2]}"></p>
      <p th:if="${cateCount[3] != 0}" th:text="${'SQL : ' + cateCorrect[3] + '/' + cateCount[3]}"></p>
    </th:block>

    <div class="inputform">
      <div class="inputselect">
        <input type="submit" value="マイページに戻る" />
      </div>
    </div>
  </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  // ---- ページネーション ----
  const rowsPerPage = 3;
  const table = document.getElementById('question-table');
  if (!table) return;
  const rows = table.querySelectorAll('.form_group');
  const pageCount = Math.ceil(rows.length / rowsPerPage);
  const container = document.getElementById('pagination-container');
  if (pageCount <= 1) return;
  let currentPage = 1;
  function showPage(page) {
    currentPage = page;
    const start = (page - 1) * rowsPerPage;
    const end = start + rowsPerPage;
    Array.from(rows).forEach((r, i) => r.style.display = (i >= start && i < end) ? '' : 'none');
    document.getElementById('p-prev').disabled = (currentPage === 1);
    document.getElementById('p-next').disabled = (currentPage === pageCount);
  }
  const prev = document.createElement('button');
  prev.id = 'p-prev'; prev.type = 'button'; prev.innerText = '前へ'; prev.className = 'p-btm';
  prev.addEventListener('click', () => { if (currentPage > 1) showPage(currentPage - 1); });
  const next = document.createElement('button');
  next.id = 'p-next'; next.type = 'button'; next.innerText = '次へ'; next.className = 'p-btm';
  next.addEventListener('click', () => { if (currentPage < pageCount) showPage(currentPage + 1); });
  container.appendChild(prev);
  container.appendChild(next);
  showPage(1);

  // ---- 実績トースト自動非表示 ----
  const toast = document.querySelector('.achievement-toast');
  if (toast) {
    setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateY(-30px)'; }, 4000);
    setTimeout(() => { toast.style.display = 'none'; }, 4600);
  }
});
</script>
</body>
</html>
