<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
</head>
<body>
<aside th:fragment="layout-sidebar"
       th:class="${session.user == null or session.user.permission == 0} ? 'search' : 'admin_menu'">
  <div class="side-inner">
    <div class="title">MENU</div>
		<div>
			<ul class="sidebar-menu">
				<li><a class="sidebar-link" th:href="@{/mypage}">MyPage</a></li>
				<li><a class="sidebar-link" th:href="@{/learning-status}">学習状況</a></li>
				<li><a class="sidebar-link" th:href="@{/study-calendar}">学習カレンダー</a></li>
				<li th:if="${session.user != null and session.user.permission == 0}">
					<a class="sidebar-link" th:href="@{/friends}">フレンド
						<span th:if="${pendingFriendRequestCount != null and pendingFriendRequestCount > 0}"
						      class="notify-badge" th:text="${pendingFriendRequestCount}">1</span>
					</a>
				</li>
				<li><a class="sidebar-link" th:href="@{/test/category}">カテゴリ別問題</a></li>
				<li><a class="sidebar-link" th:href="@{/test/diagnostic}">苦手範囲特定問題</a></li>
				<li><a class="sidebar-link" th:href="@{/test/weak}">弱点から出題</a></li>
				<li><a class="sidebar-link" th:href="@{/test/review}">復習モード</a></li>
				<li><a class="sidebar-link" th:href="@{/question}">問題検索</a></li>
				<li th:if="${session.user != null and session.user.permission == 1}">
					<a class="sidebar-link" th:href="@{/admin/questions}">問題管理</a></li>
				<li><a class="sidebar-link" th:href="@{/achievement}">実績一覧
					<span th:if="${unreadAchievementCount != null and unreadAchievementCount > 0}"
					      class="notify-badge" th:text="'NEW'">NEW</span>
				</a></li>
			</ul>
			
			<div class="sidebar-search">
				<div class="sidebar-search-item">
					<form th:action="@{/question/list/text}" method="get">
						<label for="sidebar-question-text">問題文あいまい検索</label>
						<div class="sidebar-search-controls">
							<input id="sidebar-question-text" type="text" name="questionText" class="qt" />
							<input type="submit" value="検索" />
						</div>
					</form>
				</div>

				<div class="sidebar-search-item">
					<form th:action="@{/question/list/category}" method="get">
						<label for="sidebar-category">カテゴリ検索</label>
						<div class="sidebar-search-controls">
							<select id="sidebar-category" class="category" name="category">
								<option th:each="cat : ${sidebarCategoryList}"
								        th:value="${cat.categoryId}"
								        th:text="${cat.categoryName}"></option>
							</select>
							<input type="submit" value="検索" />
						</div>
					</form>
				</div>

				<div class="sidebar-search-item">
					<form th:action="@{/question/list/difficulty}" method="get">
						<label for="sidebar-difficulty">難易度検索</label>
						<div class="sidebar-search-controls">
							<select id="sidebar-difficulty" class="difficulty" name="difficulty" style="color: #FFB11B;">
								<option value="1">★☆☆</option>
								<option value="2">★★☆</option>
								<option value="3">★★★</option>
							</select>
							<input type="submit" value="検索" />
						</div>
					</form>
				</div>

				<th:block th:if="${session.user != null and session.user.permission == 1}">
					<div class="sidebar-search-item">
						<a class="sidebar-link" th:href="@{/user/list}">ユーザー一覧</a>
					</div>

					<div class="sidebar-search-item">
						<form th:action="@{/user/list/text}" method="post">
							<label for="sidebar-user-name">ユーザー名あいまい検索</label>
							<div class="sidebar-search-controls">
								<input id="sidebar-user-name" type="text" name="userName" class="qt" />
								<input type="submit" value="検索" />
							</div>
						</form>
					</div>

					<div class="sidebar-search-item">
						<form th:action="@{/user/list/permission}" method="post">
							<label for="sidebar-user-permission">権限検索</label>
							<div class="sidebar-search-controls">
								<select id="sidebar-user-permission" class="category" name="permission">
									<option value="0">一般</option>
									<option value="1">管理者</option>
								</select>
								<input type="submit" value="検索" />
							</div>
						</form>
					</div>

					<div class="sidebar-search-item">
						<form th:action="@{/user/list/delete}" method="post">
							<label for="sidebar-user-delete">削除済みユーザー検索</label>
							<div class="sidebar-search-controls">
								<select id="sidebar-user-delete" class="category" name="deleteFlag">
									<option value="false">アクティブ</option>
									<option value="true">削除済み</option>
								</select>
								<input type="submit" value="検索" />
							</div>
						</form>
					</div>
				</th:block>
			</div>
    </div>
  </div>
</aside>
</body>
</html>
