<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
</head>
<body>
<aside th:fragment="layout-sidebar"
       th:class="${session.user == null or session.user.permission == 1} ? 'search' : 'admin_menu'">
  <div class="side-inner">
    <div class="title">MENU</div>
		<div>
			<ul class="sidebar-menu">
				<li><a class="sidebar-link" th:href="@{/mypage}">MyPage</a></li>
				<li th:if="${session.user != null and session.user.permission == 1}">
					<a class="sidebar-link" th:href="@{/friends}">フレンド</a>
				</li>
				<li><a class="sidebar-link" th:href="@{/test/category}">カテゴリ別問題</a></li>
				<li><a class="sidebar-link" th:href="@{/test/diagnostic}">苦手範囲特定問題</a></li>
				<li th:if="${session.user.permission == 2}">
					<a class="sidebar-link" th:href="@{/user/list}">ユーザー一覧</a></li>
				<li><a class="sidebar-link" th:href="@{/question}">問題検索</a></li>
				<li><a class="sidebar-link" th:href="@{/achievement}">実績一覧</a></li>
			</ul>
			
			<div class="sidebar-search">
				<div class="sidebar-search-item">
					<form th:action="@{/question/list/text}" method="get">
						<label for="sidebar-question-text">問題文あいまい検索</label>
						<div class="sidebar-search-controls">
							<input id="sidebar-question-text" type="text" name="questionText" class="qt" />
							<input type="submit" value="検索" />
						</div>
					</form>
				</div>

				<div class="sidebar-search-item">
					<form th:action="@{/question/list/category}" method="get">
						<label for="sidebar-category">カテゴリ検索</label>
						<div class="sidebar-search-controls">
							<select id="sidebar-category" class="category" name="category">
								<option value="1">Java</option>
								<option value="2">Spring</option>
								<option value="3">HTML</option>
								<option value="4">SQL</option>
							</select>
							<input type="submit" value="検索" />
						</div>
					</form>
				</div>

				<div class="sidebar-search-item">
					<form th:action="@{/question/list/difficulty}" method="get">
						<label for="sidebar-difficulty">難易度検索</label>
						<div class="sidebar-search-controls">
							<select id="sidebar-difficulty" class="difficulty" name="difficulty" style="color: #FFB11B;">
								<option value="1">★☆☆</option>
								<option value="2">★★☆</option>
								<option value="3">★★★</option>
							</select>
							<input type="submit" value="検索" />
						</div>
					</form>
				</div>

				<th:block th:if="${session.user != null and session.user.permission == 2}">
					<div class="sidebar-search-item">
						<form th:action="@{/question/list/delete}" method="get">
							<label for="sidebar-delete">削除検索</label>
							<div class="sidebar-search-controls">
								<select id="sidebar-delete" class="category" name="questionDelete">
									<option value="0">表示</option>
									<option value="1">非表示</option>
								</select>
								<input type="submit" value="検索" />
							</div>
						</form>
					</div>
				</th:block>
			</div>
    </div>
  </div>
</aside>
</body>
</html>
