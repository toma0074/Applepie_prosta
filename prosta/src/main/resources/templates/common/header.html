<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<link rel="icon" th:href="@{../images/favicon.ico}" type="image/x-icon">
</head>

<body>
	<th:block id="header" th:fragment="layout-header">
		<div class="header-container">
<!--			<div class="title" > -->
				<div class="header-logo" ><img th:src="@{/images/prosta.jpg}" alt="logo" class="logo"> </div>
			<div th:if="${session.user != null}" class="user-info">
				<!-- ログイン中のユーザ名の表示をこの下に記述してください -->
				ようこそ、<span th:text = "${session.user.userName}"></span>さん
				<a class="btn" th:href="@{/logout}">ログアウト</a>
			</div>
		</div>
	</th:block>
</body>

</html>
