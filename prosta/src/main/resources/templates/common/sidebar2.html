<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
</head>

<body>
	<aside th:fragment="layout-sidebar"
		th:class="${session.user == null or session.user.permission == 2} ? ${'search'} : ${'admin_menu'}">
		<div class="sidebar-title">MENU</div>

		<div>
			<ul class="sidebar-menu">
				<li><a class="sidebar-link" th:href="@{/mypage}">MyPage</a></li>
				<li><a class="sidebar-link" th:href="@{/test/category}">カテゴリ別問題</a></li>
				<li><a class="sidebar-link" th:href="@{/test/diagnostic}">苦手範囲特定問題</a></li>
				<li><a class="sidebar-link" th:href="@{/question/regist/input}">新規問題登録</a></li>
				<li><a class="sidebar-link" th:href="@{/question}">問題検索</a></li>
			</ul>
			<div class="sidebar-search">
				<div  th:text="名前あいまい検索"></div>
				<form th:action="@{/user/list/text}" method="post" >
					
				<div class="input">
				<input type="text" name="userName" />

				<input type="submit" value="検索" />
				</div>
				</form>
				
				<div  th:text="権限検索"></div>
				<form th:action="@{/user/list/permission}" method="post" >
						<div class="input">
							<select class="permission" name="permission">
								<option th:value="1">一般</option>
								<option th:value="2">管理者</option>
							</select>
							<input type="submit" value="検索" />
						</div>
					</form>
					
				<div  th:text="削除済みユーザー検索"></div>
				<form th:action="@{/user/list/delete}" method="post" >
					<div class="input">
						<select class="deleteFlag" name="deleteFlag">
							<option th:value="0">アクティブ</option>
							<option th:value="1">削除済み</option>
						</select>
						<input type="submit" value="検索" />
					</div>
					</form>
				</div>
		</div>
	</aside>
</body>

</html>
