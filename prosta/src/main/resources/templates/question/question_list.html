<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout_4block :: layout(~{::body/content()})}">
<head>
<title>検索結果一覧</title>
<meta charset="UTF-8" />
</head>
<body>
<h3 th:if="${isBookmarkList == true}">ブックマーク一覧</h3>
<div class="forms">
  <p class="label" th:unless="${isBookmarkList == true}">検索：「<strong th:text="${QuestionResult}"></strong>」</p>
</div>
<p th:if="${error}" class="error-message" th:text="${error}"></p>
<th:block th:if="${isBookmarkList == true}">
  <form class="bookmark-filters" th:action="@{/question/bookmarks}" method="get">
    <label>カテゴリ：
      <select class="category" name="category">
        <option value="">すべて</option>
        <option th:each="cat : ${categoryList}" th:value="${cat.categoryId}"
                th:selected="${cat.categoryId == bookmarkCategory}" th:text="${cat.categoryName}"></option>
      </select>
    </label>
    <label>難易度：
      <select class="difficulty" name="difficulty">
        <option value="">すべて</option>
        <option th:each="d : ${#numbers.sequence(1,3)}" th:value="${d}"
                th:selected="${d == bookmarkDifficulty}"
                th:text="${d == 1 ? '★☆☆' : d == 2 ? '★★☆' : '★★★'}"></option>
      </select>
    </label>
    <input type="submit" value="絞り込み" />
  </form>
  <form id="bookmark-start" th:unless="${#lists.isEmpty(Questions)}"
        th:action="@{/test/bookmarks/start}" method="get">
    <input type="hidden" name="category" th:value="${bookmarkCategory}" />
    <input type="hidden" name="difficulty" th:value="${bookmarkDifficulty}" />
    <div th:replace="~{common/question_count :: selector}"></div>
    <p>チェックした問題から出題します。未選択の場合は表示中の全問題が対象です。</p>
    <button type="submit" class="btn bookmark-start-button">ブックマークから出題</button>
  </form>
</th:block>
<p class="btn" th:unless="${isBookmarkList == true}"><a th:href="@{/question/bookmarks}">ブックマーク一覧</a></p>
<div th:if="${session.user != null and session.user.permission == 1}">
  <p class="btn"><a th:href="@{/admin/questions/new}">新規問題登録</a></p>
</div>
<div id="pagination-container" class="pagination-container"
     data-pagination-target="question-table" data-pagination-rows="tbody tr" data-pagination-size="6"></div>

<th:block th:if="${#lists.isEmpty(Questions)}">
  <div class="message">
    <p class="back_to_top_message" th:text="${isBookmarkList == true} ? 'ブックマークした問題はありません。問題検索で☆を押すと追加できます。' : '該当する問題は存在しません。'"></p>
    <p class="btn"><a th:href="@{/question}">一覧表示に戻る</a></p>
    <p class="btn"><a th:href="@{/mypage}">マイページに戻る</a></p>
  </div>
</th:block>

<table class="question_list" id="question-table" th:if="${!#lists.isEmpty(Questions)}">
  <thead>
    <tr>
      <th class="category">カテゴリー</th>
      <th th:if="${isBookmarkList == true}" class="question-selection">出題対象</th>
      <th class="difficulty">難易度</th>
      <th class="questionText">問題文</th>
      <th class="bookmark">ブックマーク</th>
    </tr>
  </thead>
  <tbody>
    <tr th:each="q:${Questions}">
      <td class="center" th:text="${q.category != null ? q.category.categoryName : ''}"></td>
      <td th:if="${isBookmarkList == true}" class="center question-selection">
        <input type="checkbox" form="bookmark-start" name="questionIds" th:value="${q.questionId}"
               th:attr="aria-label=|問題${q.questionId}を出題対象にする|" />
      </td>
      <td class="center" th:switch="${q.difficulty}" style="color: #FFB11B;">
        <span th:case="1">★☆☆</span>
        <span th:case="2">★★☆</span>
        <span th:case="3">★★★</span>
      </td>
      <td class="qtext">
        <span th:text="${q.questionText}"></span>
      </td>
      <td class="center bookmark-cell">
        <form th:action="@{/question/{id}/study(id=${q.questionId})}" method="get">
          <input type="hidden" name="returnUrl" th:value="${isBookmarkList == true ? '/question/bookmarks' : '/question'}" />
          <input type="submit" class="bookmark-button"
                 th:with="marked=${favoriteIds != null and favoriteIds.contains(q.questionId)}"
                 th:value="${marked} ? '★' : '☆'"
                 title="解説・学習メモを開く（登録・解除は移動先で操作）"
                 aria-label="解説・学習メモを開く（登録・解除は移動先で操作）" />
        </form>
      </td>
    </tr>
  </tbody>
</table>
<p class="btn"><a th:href="@{/question}">一覧表示に戻る</a></p>

</body>
</html>
