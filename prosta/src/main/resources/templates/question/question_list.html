<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout_4block :: layout(~{::body/content()})}">
<head>
<title>検索結果一覧</title>
<meta charset="UTF-8" />
</head>
<body>
<div class="forms">
  <p class="label">検索：「<strong th:text="${QuestionResult}"></strong>」</p>
</div>
<div th:if="${session.user != null and session.user.permission == 1}">
  <p class="btn"><a th:href="@{/admin/questions/new}">新規問題登録</a></p>
</div>
<div id="pagination-container" style="display:flex;gap:5px;justify-content:center;margin-top:5px;"></div>

<th:block th:if="${#lists.isEmpty(Questions)}">
  <div class="message">
    <p class="back_to_top_message">該当する問題は存在しません。</p>
    <p class="btn"><a th:href="@{/question}">一覧表示に戻る</a></p>
    <p class="btn"><a th:href="@{/mypage}">マイページに戻る</a></p>
  </div>
</th:block>

<table class="question_list" id="question-table" th:if="${!#lists.isEmpty(Questions)}">
  <thead>
    <tr>
      <th class="category">カテゴリ</th>
      <th class="difficulty">難易度</th>
      <th class="questionText">問題文</th>
    </tr>
  </thead>
  <tbody>
    <tr th:each="q:${Questions}">
      <td class="center" th:text="${q.category != null ? q.category.categoryName : ''}"></td>
      <td class="center" th:switch="${q.difficulty}" style="color: #FFB11B;">
        <span th:case="1">★☆☆</span>
        <span th:case="2">★★☆</span>
        <span th:case="3">★★★</span>
      </td>
      <td class="qtext" th:text="${q.questionText}"></td>
    </tr>
  </tbody>
</table>
<p class="btn"><a th:href="@{/question}">一覧表示に戻る</a></p>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const rowsPerPage = 6;
  const table = document.getElementById('question-table');
  if (!table) return;
  const rows = table.querySelectorAll('tbody tr');
  const pageCount = Math.ceil(rows.length / rowsPerPage);
  const container = document.getElementById('pagination-container');
  if (pageCount <= 1) return;
  let currentPage = 1;
  function showPage(page) {
    currentPage = page;
    const start = (page - 1) * rowsPerPage;
    const end = start + rowsPerPage;
    Array.from(rows).forEach((r, i) => r.style.display = (i >= start && i < end) ? '' : 'none');
    document.getElementById('p-prev').disabled = (currentPage === 1);
    document.getElementById('p-next').disabled = (currentPage === pageCount);
  }
  const prev = document.createElement('button');
  prev.id = 'p-prev'; prev.type = 'button'; prev.innerText = '前へ'; prev.className = 'p-btm';
  prev.addEventListener('click', () => { if (currentPage > 1) showPage(currentPage - 1); });
  const next = document.createElement('button');
  next.id = 'p-next'; next.type = 'button'; next.innerText = '次へ'; next.className = 'p-btm';
  next.addEventListener('click', () => { if (currentPage < pageCount) showPage(currentPage + 1); });
  container.appendChild(prev);
  container.appendChild(next);
  showPage(1);
});
</script>
</body>
</html>
