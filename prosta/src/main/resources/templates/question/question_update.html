<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout_4block :: layout(~{::body/content()})}">
<head>
<title>問題登録・更新</title>
<meta charset="UTF-8" />
</head>
<body>
<h3 th:text="*{questionId == null} ? '問題登録' : '問題更新'"></h3>
<div class="update">
  <form th:action="@{/question/update/check}" method="post" th:object="${question}">

    <th:block th:if="${#fields.hasAnyErrors()}">
      <div class="error-message" th:errors="*{questionText}"></div>
      <div class="error-message" th:errors="*{optionA}"></div>
      <div class="error-message" th:errors="*{optionB}"></div>
      <div class="error-message" th:errors="*{optionC}"></div>
    </th:block>

    <div class="form">
      <div class="label">カテゴリー:</div>
      <div class="qccheck">
        <select class="category" th:field="*{category}">
          <option value="1">Java</option>
          <option value="2">Spring</option>
          <option value="3">HTML</option>
          <option value="4">SQL</option>
        </select>
      </div>
    </div>
    <div class="form">
      <div class="label">問題文:</div>
      <div class="qccheck">
        <textarea th:field="*{questionText}"></textarea>
      </div>
    </div>
    <div class="form">
      <div class="label">選択肢A:</div>
      <div class="qccheck">
        <input type="text" th:field="*{optionA}" />
      </div>
    </div>
    <div class="form">
      <div class="label">選択肢B:</div>
      <div class="qccheck">
        <input type="text" th:field="*{optionB}" />
      </div>
    </div>
    <div class="form">
      <div class="label">選択肢C:</div>
      <div class="qccheck">
        <input type="text" th:field="*{optionC}" />
      </div>
    </div>
    <div class="form">
      <div class="label">難易度:</div>
      <div class="qccheck">
        <select class="difficulty-star"
        th:field="*{difficulty}">
          <option value="1">★☆☆</option>
          <option value="2">★★☆</option>
          <option value="3">★★★</option>
        </select>
      </div>
    </div>
    <div class="form">
      <div class="label">正解の選択肢:</div>
      <div class="qccheck">
        <select class="category" th:field="*{correctOption}">
          <option value="1">A</option>
          <option value="2">B</option>
          <option value="3">C</option>
        </select>
      </div>
    </div>
    <div class="form">
      <div class="label"></div>
      <div class="qccheck">
        <input type="hidden" th:field="*{questionId}" th:if="*{questionId != null}">
        <input type="submit" th:value="*{questionId == null} ? '新規作成' : '更新'">
      </div>
    </div>
  </form>
  <div class="button-area">
  <a class="btn" href="javascript:history.back()">前の画面に戻る</a>
  <a class="btn" th:href="@{/question}">一覧表示に戻る</a>
  </div>
</div>
</body>
</html>
