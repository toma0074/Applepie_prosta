<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(body)">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" type="text/css" th:href="@{/css/layout.css}" />
  <link rel="stylesheet" type="text/css" th:href="@{/css/common.css}" />
  <link rel="stylesheet" type="text/css" th:href="@{/css/stylesheet.css}" />
  <link rel="stylesheet" type="text/css" th:href="@{/css/gamification.css}" />
  <link rel="stylesheet" type="text/css" th:href="@{/css/test.css}" />
  <link rel="stylesheet" type="text/css" th:href="@{/css/prosta-system.css}" />
  <link rel="icon" th:href="@{/images/favicon.ico}" type="image/x-icon">
  <title>PROSTA</title>
</head>
<body
  th:class="${(session.backgroundClass != null ? session.backgroundClass : 'bg-default') + ' prosta-app'}"
  th:style="${session.backgroundColor != null ?
    'background-color:' + session.backgroundColor + ';background-image:none;' : ''}">
  <header>
    <div th:replace="~{common/header :: layout-header}"></div>
  </header>

  <div class="content">
    <article>
      <div th:replace="${body}"></div>
    </article>
  </div>

  <footer>
    <div th:replace="~{common/footer :: layout-footer}"></div>
  </footer>
</body>
</html>
