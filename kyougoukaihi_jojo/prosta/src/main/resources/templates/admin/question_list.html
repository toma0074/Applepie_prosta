<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout_4block :: layout(~{::body/content()})}">
<head>
<title>問題管理</title>
<meta charset="UTF-8" />
</head>
<body>
<div class="aq-wrap">
  <h3>問題管理</h3>
  <p th:if="${message}" class="aq-msg ok" th:text="${message}"></p>
  <p th:if="${error}" class="aq-msg ng" th:text="${error}"></p>

  <p><a th:href="@{/admin/questions/new}">＋ 新規問題登録</a></p>

  <form class="aq-filter" th:action="@{/admin/questions}" method="get">
    <select class="category" name="categoryId">
      <option value="">カテゴリー(全て)</option>
      <option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.categoryName}"
              th:selected="${categoryId != null and categoryId == c.categoryId}"></option>
    </select>
    <select class="difficulty" name="difficulty">
      <option value="">難易度(全て)</option>
      <option value="1" th:selected="${difficulty != null and difficulty == 1}">★☆☆</option>
      <option value="2" th:selected="${difficulty != null and difficulty == 2}">★★☆</option>
      <option value="3" th:selected="${difficulty != null and difficulty == 3}">★★★</option>
    </select>
    <input type="text" class="qt" name="keyword" th:value="${keyword}" placeholder="問題文キーワード" />
    <label><input type="checkbox" name="noExplanation" value="true" th:checked="${noExplanation}" /> 解説なしのみ</label>
    <input type="submit" value="検索" />
  </form>

  <p th:if="${#lists.isEmpty(rows)}">該当する問題はありません。</p>

  <div class="aq-pager" th:if="${page.totalPages > 1}">
    <a class="aq-page-btn" th:classappend="${!page.hasPrevious()} ? 'disabled'"
       th:href="${page.hasPrevious()} ? @{/admin/questions(categoryId=${categoryId},difficulty=${difficulty},keyword=${keyword},noExplanation=${noExplanation},page=${page.number - 1})} : '#'">前へ</a>
    <span th:text="${page.number + 1} + ' / ' + ${page.totalPages}"></span>
    <a class="aq-page-btn" th:classappend="${!page.hasNext()} ? 'disabled'"
       th:href="${page.hasNext()} ? @{/admin/questions(categoryId=${categoryId},difficulty=${difficulty},keyword=${keyword},noExplanation=${noExplanation},page=${page.number + 1})} : '#'">次へ</a>
  </div>

  <div class="aq-scroll" th:unless="${#lists.isEmpty(rows)}">
    <table class="aq-table">
      <thead>
        <tr>
          <th>ID</th><th>カテゴリー</th><th>難易度</th><th>問題文</th><th>解説</th><th>操作</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="r : ${rows}">
          <td class="num" th:text="${r.question.questionId}"></td>
          <td class="num" th:text="${r.question.category != null ? r.question.category.categoryName : ''}"></td>
          <td class="num" th:text="${'★'.repeat(r.question.difficulty) + '☆'.repeat(3 - r.question.difficulty)}"></td>
          <td th:text="${r.question.questionText}"></td>
          <td class="num" th:text="${#strings.isEmpty(r.question.explanation) ? '未' : '有'}"></td>
          <td>
            <div class="aq-actions">
              <form th:action="@{/admin/questions/{id}/edit(id=${r.question.questionId})}" method="get">
                <input type="submit" value="編集" />
              </form>
              <form th:action="@{/admin/questions/{id}/delete(id=${r.question.questionId})}" method="post"
                    onsubmit="return confirm('この問題を削除しますか？');">
                <input type="submit" value="削除" />
              </form>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
</body>
</html>
